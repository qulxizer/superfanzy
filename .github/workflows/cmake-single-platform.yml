name: Build Firmware

on:
  push:
    branches: [ main, ci ]
  pull_request:
    branches: [ main, ci ]
  workflow_dispatch: # Allows you to trigger this build manually

  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: "v4.4"
      - name: Build Project
        run: |
          pip install --upgrade idf-component-manager
          idf.py build
